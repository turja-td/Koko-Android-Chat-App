name: koko
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  flutter_webrtc: ^1.6.3
  file_picker: ^13.3.3
  http: ^1.6.0
  shared_preferences: ^2.5.6
  provider: ^6.1.5+1
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3
  flutter_local_notifications: ^23.0.3
  wakelock_plus: ^1.8.2
  google_fonts: ^9.0.0
  path_provider: ^2.1.6
  audioplayers: ^6.8.1
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#6C5CE7"
  adaptive_icon_foreground: "assets/logo/logo_foreground.png"

flutter_native_splash:
  color: "#6C5CE7"
  image: assets/logo/logo_foreground.png
  android_12:
    color: "#6C5CE7"
    image: assets/logo/logo_foreground.png